[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "coevo-drl"
version = "1.0.0"
description = "Tumor-immune coevolution and adaptive immunotherapy sequencing"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.1.3", "scipy==1.14.1", "torch==2.5.1", "pyyaml==6.0.2"]

[project.scripts]
coevo-drl = "coevo_drl.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["coevo_drl"]
mypy_path = "code"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "no-untyped-call"]
